# conflicts_escalate_to_pr — a conflicted rebase the headless resolver cannot
# settle leaves as a PR, never as a silent stall and never as a false landing.
#
# The imported conflict resolver is write-fenced (Read/Edit, no Bash): the story
# drives every git command, which is also what records the resolution into
# rerere. `land` projects auto_escalate: true into it, so an unresolved conflict
# EXITS instead of holding in-room for an operator who isn't there.
#
# The outcome is `pr-opened`, a distinct status from `landed`, and landed_sha
# stays empty — the two are never conflated.
#
# KNOWN GAP, PINNED HERE ON PURPOSE (see README.md "Known gap"): the PR *body*
# reaches the provider with an EMPTY resolver report. land composes that body
# from its own `last_error`, which the `cr` import projection fills with a
# template referencing `world.cr__conflict_verdict`. That projection template is
# not re-rewritten when land is itself imported, so at this fold depth it renders
# to nothing. Everything that decides WHAT HAPPENS is correct — a PR is opened,
# against the right base, from the right head, with the right title, and nothing
# is pushed. What is lost is prose inside the PR body. This flow asserts the real
# current behaviour rather than the intended one, so the day upstream fixes it
# this test fails loudly and we tighten it.

test_kind: flow
app: ../app.yaml
initial_state: ready
initial_world:
  worktree_path:    ".worktrees/rich-evidence-modal"
  workspace_branch: "feat/rich-evidence-modal"

host_handlers:
  host.git:
    by_call:
      land_fetch: { data: { ok: true, fetched_sha: "1cd1fd2" } }
      # Conflicts: host.git.rebase never aborts, so the rebase is LEFT IN
      # PROGRESS — exactly the state conflict-resolve's entry contract requires.
      land_rebase:
        data:
          outcome: conflicts
          head_sha: "60d6b81"
          conflicted_files: ["packages/feedback-vue/src/FeedbackModal.vue"]
          error: ""
      open_pr_exec:
        data:
          ok: true
          outcome: opened
          url: "https://github.com/bsacrobatix/studio-sassfully/pull/12"
          pr_id: "12"
          repo: "bsacrobatix/studio-sassfully"
  host.run:
    by_call:
      gather_conflict_files:
        data: { stdout_json: { conflict_files: "packages/feedback-vue/src/FeedbackModal.vue", gosum_only: false } }
  host.agent.task:
    data:
      submitted:
        resolved:           false
        confidence:         0.2
        resolution_summary: "Both sides restructured the modal's capture controls; the two evidence-attachment flows cannot be reconciled mechanically."
        unresolvable_files: ["packages/feedback-vue/src/FeedbackModal.vue"]
        reason:             "semantic conflict — needs a product decision on which capture flow wins"

turns:
  - intent: { name: land, slots: {} }
    expect_state: __exit__pr-opened
    expect_world:
      status:     pr-opened
      pr_url:     "https://github.com/bsacrobatix/studio-sassfully/pull/12"
      # NOTHING was pushed.
      landed_sha: ""
      ln__rebase_outcome: conflicts
    expect_host_calls:
      # The escalation PR targets THIS repo's landing target, from the branch
      # that failed to land.
      - handler: host.git
        args:
          op:    open_pr
          base:  "staging/local"
          head:  "feat/rich-evidence-modal"
          title: "land: feat/rich-evidence-modal → staging/local (needs conflict resolution)"

expect_terminal: true
