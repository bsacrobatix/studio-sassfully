# push_race_retries_then_lands — the reason this repo wants the loop at all.
#
# ~20 branch worktrees land onto one `staging/local`, so losing the push race is
# the NORMAL case, not the exception. Here the first push is rejected
# non-fast-forward because another agent landed first; the loop refetches,
# replays onto their commit, RE-RUNS `scripts/checks.sh` on the new rebased sha,
# and pushes again — landing on attempt 2 with no queue, no lock, and no wait.
#
# The re-gate is the load-bearing assertion: the sha that lands was proven ON TOP
# OF the winner's commit, not merely in isolation against the stale target.

test_kind: flow
app: ../app.yaml
initial_state: ready
initial_world:
  worktree_path:    ".worktrees/review-sessions"
  workspace_branch: "feat/review-sessions"

host_handlers:
  host.git:
    by_call:
      land_fetch:
        responses:
          - data: { ok: true, fetched_sha: "1cd1fd2" }
          # A concurrent agent landed between our fetch and our push.
          - data: { ok: true, fetched_sha: "8a90625" }
      land_rebase:
        responses:
          - data: { outcome: rebased, head_sha: "d4c2c4d", conflicted_files: [], error: "" }
          - data: { outcome: rebased, head_sha: "f00dbad", conflicted_files: [], error: "" }
      land_push:
        responses:
          - data:
              outcome: rejected_non_ff
              ok: false
              url: "https://github.com/bsacrobatix/studio-sassfully.git"
              error: "git.push origin HEAD:refs/heads/staging/local: ! [rejected] HEAD -> staging/local (non-fast-forward)"
          - data: { outcome: pushed, ok: true, url: "https://github.com/bsacrobatix/studio-sassfully.git", error: "" }
  host.run:
    by_call:
      land_gate:
        responses:
          - data: { ok: true, exit_code: 0, stdout: "checks: green" }
          # Re-proven on the rebased-onto-the-winner sha before the second push.
          - data: { ok: true, exit_code: 0, stdout: "checks: green" }

turns:
  - intent: { name: land, slots: {} }
    expect_state: __exit__landed
    expect_world:
      status: landed
      # The sha that landed is the SECOND rebase's head — the one the gate ran
      # on top of the winner's commit, not the stale first attempt.
      landed_sha:      "f00dbad"
      last_error:      ""
      ln__attempt:     2
      ln__head_sha:    "f00dbad"
      ln__fetched_sha: "8a90625"
      ln__push_outcome: pushed

expect_terminal: true
expect_no_errors: true
