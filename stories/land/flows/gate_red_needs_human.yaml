# A remote red is its own terminal outcome: the branch remains a pull request
# and the imported evidence is projected through the Sassfully wrapper.
test_kind: flow
app: ../app.yaml
initial_state: ready
initial_world:
  worktree_path: ".worktrees/tour-foundation-recovery"
  workspace_branch: "feat/tour-foundation-recovery"
host_handlers:
  host.git:
    by_call:
      land_fetch:   { data: { ok: true, fetched_sha: "aaaa111" } }
      land_probe:   { data: { ok: true, fetched_sha: "" } }
      land_rebase:  { data: { outcome: rebased, head_sha: "bbbb222", conflicted_files: [], error: "" } }
      land_publish: { data: { outcome: pushed, ok: true, url: "git@github.com:bsacrobatix/studio-sassfully.git", error: "" } }
      land_open_pr:
        data: { ok: true, outcome: opened, url: "https://github.com/bsacrobatix/studio-sassfully/pull/13", pr_id: "13", repo: "bsacrobatix/studio-sassfully" }
      land_arm:
        data: { ok: true, outcome: armed, merge_method: merge, pr_id: "13", head_sha: "bbbb222", merged: false, merged_sha: "", detail: "auto-merge armed" }
      land_await:
        data: { ok: true, outcome: checks_failed, merged: false, merged_sha: "", head_sha: "bbbb222", state: failure, pr_state: open, mergeable_state: "clean", checks_summary: "state: failure", failed_log: "checks: failure", polls: 2, waited_seconds: 40 }
      land_check_log:
        data: { ok: true, state: failure, failed_count: 1, checks: ["checks"], truncated: false, log: "checks failed" }
turns:
  - intent: { name: land, slots: {} }
    expect_state: __exit__checks-red
    expect_world:
      status: checks-red
      landed_sha: ""
      pr_url: "https://github.com/bsacrobatix/studio-sassfully/pull/13"
      last_error: "remote CI is RED on feat/tour-foundation-recovery (head bbbb222) in https://github.com/bsacrobatix/studio-sassfully/pull/13.\nchecks: failure\n\n--- failing check log ---\nchecks failed\n\nFix it in this worktree, commit, and run land again — the pull request is already open and will be adopted, not duplicated."
expect_terminal: true
