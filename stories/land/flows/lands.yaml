# lands — the headline path, wired with THIS repo's target and gate.
#
# Proves the two things the importer is responsible for: `land` on the `ready`
# room enters the imported loop, and the loop is configured with sassfully's own
# `origin/staging/local` + `bash scripts/checks.sh` — not the upstream defaults
# and not `main` (which is 42 commits behind staging/local).
#
# The structural invariants are asserted from the real host calls: the rebase
# `onto` is the remote-tracking ref, and the push is a plain refspec push with no
# force flag anywhere.

test_kind: flow
app: ../app.yaml
initial_state: ready
initial_world:
  worktree_path:    ".worktrees/feedback-list-api"
  workspace_branch: "feat/feedback-list-api"

host_handlers:
  host.git:
    by_call:
      land_fetch:  { data: { ok: true, fetched_sha: "1cd1fd2" } }
      land_rebase: { data: { outcome: rebased, head_sha: "b4193e8", conflicted_files: [], error: "" } }
      land_push:   { data: { outcome: pushed, ok: true, url: "https://github.com/bsacrobatix/studio-sassfully.git", error: "" } }
  host.run:
    by_call:
      land_gate: { data: { ok: true, exit_code: 0, stdout: "checks: green" } }

turns:
  - intent: { name: land, slots: {} }
    expect_state: __exit__landed
    expect_world:
      status:     landed
      landed_sha: "b4193e8"
      last_error: ""
      # The imported loop's own view of the same landing.
      ln__gate_ok:        true
      ln__rebase_outcome: rebased
      ln__push_outcome:   pushed
      ln__attempt:        1
    expect_host_calls:
      # sassfully's gate, verbatim, run in the branch worktree.
      - handler: host.run
        args: { cmd: "bash scripts/checks.sh", cwd: ".worktrees/feedback-list-api" }
      # The rebase target is the REMOTE-TRACKING ref for THIS repo's target.
      - handler: host.git
        args: { op: rebase, onto: "origin/staging/local" }
      # The push names the remote branch by refspec — no local staging/local
      # branch, no force.
      - handler: host.git
        args: { op: push, remote: origin, refspec: "HEAD:refs/heads/staging/local" }

expect_terminal: true
expect_no_errors: true
