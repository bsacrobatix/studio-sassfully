# A confirmed remote merge is the only path that reports a landing. The wrapper
# fixes Sassfully's target and projects the imported landed outcome unchanged.
test_kind: flow
app: ../app.yaml
initial_state: ready
initial_world:
  worktree_path: ".worktrees/feedback-list-api"
  workspace_branch: "feat/feedback-list-api"
host_handlers:
  host.git:
    by_call:
      land_fetch:   { data: { ok: true, fetched_sha: "aaaa111" } }
      land_probe:   { data: { ok: true, fetched_sha: "" } }
      land_rebase:  { data: { outcome: rebased, head_sha: "bbbb222", conflicted_files: [], error: "" } }
      land_publish: { data: { outcome: pushed, ok: true, url: "git@github.com:bsacrobatix/studio-sassfully.git", error: "" } }
      land_open_pr:
        data: { ok: true, outcome: opened, url: "https://github.com/bsacrobatix/studio-sassfully/pull/12", pr_id: "12", repo: "bsacrobatix/studio-sassfully" }
      land_arm:
        data: { ok: true, outcome: armed, merge_method: merge, pr_id: "12", head_sha: "bbbb222", merged: false, merged_sha: "", detail: "auto-merge armed" }
      land_await:
        data: { ok: true, outcome: merged, merged: true, merged_sha: "cccc333", head_sha: "bbbb222", state: success, pr_state: closed, mergeable_state: "clean", checks_summary: "state: success", failed_log: "", polls: 4, waited_seconds: 80 }
turns:
  - intent: { name: land, slots: {} }
    expect_state: __exit__landed
    expect_world:
      status: landed
      landed_sha: "cccc333"
      ln__head_sha: "bbbb222"
      ln__merged_sha: "cccc333"
    expect_host_calls:
      - handler: host.git
        args: { op: rebase, onto: "origin/staging/local" }
      - handler: host.git
        args: { op: push, remote: origin, refspec: "HEAD:refs/heads/feat/feedback-list-api" }
expect_terminal: true
expect_no_errors: true
