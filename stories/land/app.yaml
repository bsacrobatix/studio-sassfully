# sassfully-land — reviewable remote-CI landing for studio-sassfully.
#
# This story is DELIBERATELY THIN. The landing loop itself (fetch → rebase onto
# the remote-tracking ref → headless conflict resolution → branch publication →
# pull request → remote required-check verdict) lives in Kitsoki's
# `@kitsoki/land`, and is IMPORTED here rather than copied. Three divergent
# copies of a landing loop is how a repo ends up with a landing loop that
# quietly force-pushes.
#
# What this file owns is exactly the part that is sassfully's business:
#
#   target        staging/local   — the live integration branch. `main` is 42
#                                   commits BEHIND it; landing onto main would
#                                   silently target a stale ref.
#   resolver_build_check  scripts/checks.sh — the repo's reviewed deterministic
#                                   check, fixed by this pipeline while the
#                                   conflict resolver evaluates a resolution.
#                                   Remote CI is the landing gate.
#   remote        origin
#
# THE INVARIANTS COME FROM THE IMPORT, NOT FROM DISCIPLINE. Because the loop is
# @kitsoki/land's, this repo inherits its structural guarantees rather than
# re-deriving them: the rebase target is the remote-tracking ref
# `origin/staging/local` (no local branch for the protected target is ever
# created), publication has no --force path, and `landed_sha` binds ONLY from a
# confirmed merge. A required-check verdict is never presented as a landing.
#
# The reviewed resolver build check is pipeline-owned: it is a literal child
# projection below, not a world value or an intent slot supplied by a caller.
# A caller cannot replace it with a weaker command. The actual landing gate is
# the protected branch's remote CI.
#
# `@kitsoki/land` owns GitHub mutation and required-check waiting. This wrapper
# owns only Sassfully's fixed destination and the terminal outcome projection.

app:
  id: sassfully-land
  version: 0.1.0
  title: "sassfully land — remote-CI pull-request landing onto staging/local"
  author: "studio-sassfully"
  license: "Apache-2.0"

hosts:
  - host.git

world:
  # ── The caller seeds these ─────────────────────────────────────────────────
  worktree_path:    { type: string, default: "." }              # the worktree holding the committed branch
  workspace_branch: { type: string, default: "" }               # the branch to land
  target:           { type: string, default: "staging/local" }  # REMOTE branch — never checked out locally
  remote:           { type: string, default: "origin" }
  max_attempts:     { type: int,    default: 5 }                # bound on remote-check waits
  # A pipeline may select reviewer-owned check watching. This never changes the
  # fixed resolver command above; it only withholds the irreversible merge.
  arm_auto_merge:   { type: bool,   default: true }
  # Promotion context, when present, is verified as an exact merge parent by
  # the imported pipeline. Rebase is never selected for an exact source.
  preserve_head_sha: { type: string, default: "" }

  # ── Outcome (projected out of the import) ──────────────────────────────────
  status:            { type: string, default: "" }
  landed_sha:        { type: string, default: "" } # confirmed merge only
  pr_url:            { type: string, default: "" }
  head_sha:          { type: string, default: "" }
  last_error:        { type: string, default: "" }

intents:
  land:
    description: "Publish the committed worktree branch, await remote CI, and report the terminal verdict."
    examples: ["land", "land it", "ship it", "push to staging"]
    priority: 90
  look:
    description: "Re-render the current room."
    examples: ["look", "status"]
    priority: 5

exits:
  landed:
    description: "The branch is on origin/staging/local; landed_sha is the commit that landed."
    requires: [landed_sha]
  pr-opened:
    description: "Escalated to a PR instead of landing; pr_url is that PR."
    requires: [pr_url]
  needs-human:
    description: "Landing stopped; last_error carries the real failure."
    requires: [last_error]
  checks-red:
    description: "Remote required checks failed; last_error carries the check evidence."
    requires: [pr_url, last_error]
  checks-green:
    description: "Remote required checks passed for a reviewer-owned pull request; it has not landed."
    requires: [pr_url, head_sha]
  exact-source-refused:
    description: "Exact-source promotion was refused before it could be called a landing."
    requires: [preserve_head_sha, last_error]

root: ready

imports:
  # The whole loop. `entry: fetch` skips land's own bootstrap room — `ready`
  # below already is this repo's bootstrap, and entering at `fetch` starts the
  # loop on the operator's single `land` submission instead of asking twice.
  ln:
    source: "@kitsoki/land"
    entry: fetch
    world_in:
      worktree_path:    "{{ world.worktree_path }}"
      workspace_branch: "{{ world.workspace_branch }}"
      target:           "{{ world.target }}"
      remote:           "{{ world.remote }}"
      # The only local command is fixed by this authored pipeline. It is used
      # solely by the imported conflict resolver; remote CI remains the landing
      # gate. There is deliberately no caller-provided gate_command world key.
      resolver_build_check: "bash scripts/checks.sh"
      max_attempts:     "{{ world.max_attempts }}"
      arm_auto_merge:   "{{ world.arm_auto_merge }}"
      preserve_head_sha: "{{ world.preserve_head_sha }}"
      merge_method: "merge"
    # land's public surface is `land` / `look`, and `land` only matters at its
    # own bootstrap room, which `entry: fetch` bypasses. Nothing to lift.
    intents:
      import: []
    exits:
      landed:
        to: "@exit:landed"
        set:
          status:     "landed"
          landed_sha: "{{ world.ln__landed_sha }}"
      checks-red:
        to: "@exit:checks-red"
        set:
          status:     "checks-red"
          pr_url:     "{{ world.ln__pr_url }}"
          last_error: "{{ world.last_error }}"
      checks-green:
        to: "@exit:checks-green"
        set:
          status:   "checks-green"
          pr_url:   "{{ world.ln__pr_url }}"
          head_sha: "{{ world.ln__head_sha }}"
      # A DIFFERENT outcome from `landed`, and never conflated with it: the work
      # is preserved as a PR carrying the resolver's real reason.
      pr-opened:
        to: "@exit:pr-opened"
        set:
          status:     "pr-opened"
          pr_url:     "{{ world.ln__pr_url }}"
      needs-human:
        to: "@exit:needs-human"
        set:
          status:     "needs-human"
          last_error: "{{ world.last_error }}"
      exact-source-refused:
        to: "@exit:exact-source-refused"
        set:
          status:            "exact-source-refused"
          preserve_head_sha: "{{ world.ln__preserve_head_sha }}"
          last_error:        "{{ world.last_error }}"

states:

  ready:
    description: "Ready to land — submit `land` to publish a branch, open a pull request, and await remote required checks."
    relevant_world: [workspace_branch, worktree_path, target, remote, max_attempts]
    view:
      - prose: "Landing **{{ world.workspace_branch|default:'(no branch set)' }}** through a pull request into **{{ world.remote }}/{{ world.target }}**. The imported pipeline rebases on the remote-tracking ref, publishes without force, and reports the remote required-check verdict separately from a confirmed merge."
      - kv:
          pairs:
            Branch:   '{{ world.workspace_branch|default:"(none)" }}'
            Worktree: "{{ world.worktree_path }}"
            Target:   "{{ world.remote }}/{{ world.target }} (remote ref — never checked out locally)"
            Gate:     "remote required checks (resolver build check: bash scripts/checks.sh)"
            Attempts: "up to {{ world.max_attempts }} remote-check waits"
      - choice:
          mode: single
          prompt: "Actions"
          items:
            - label: "land"
              hint:  "fetch → publish → PR → remote required checks"
              intent: land
            - label: "look"
              intent: look
    on:
      land:
        - target: ln
      look:
        - target: .
