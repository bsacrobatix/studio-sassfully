states:
  mockup:
    description: "Generating the mockup HTML + starter manifest/tours/deck"
    relevant_world: [node_id, scenario_path, manifest_path, mockup_path, status]
    on_enter:
      - set: { mockup_path: "{{ '.artifacts/' + world.node_id + '/mockup.html' }}" }
      - invoke: host.demo
        id: mockup_create
        with:
          op: create
          scenario_path: "{{ world.scenario_path }}"
          out_path: "{{ world.mockup_path }}"
          manifest: true
        bind: { create_stdout: stdout }
        on_error: failed
      - set: { status: "mockup-created" }
    view:
      extends: "base"
      blocks:
        body:
          - prose: "create-mockup.mjs --manifest wrote the mockup HTML plus a starter *.demo.json manifest, starter tours, and a starter deck (contract §4/§6)."
          - kv:
              pairs:
                Mockup: "{{ world.mockup_path }}"
                Manifest: "{{ world.manifest_path }}"
                Status: "{{ world.status }}"
        choices:
          - list:
              items:
                - { label: "next", hint: "generate/confirm tours" }
                - { label: "restart" }
                - { label: "look" }
    on:
      next:
        - target: tours
      restart:
        - target: project
          effects:
            - set: { status: "", mockup_path: "", doctor_ok: false, doctor_report: "" }
      look:
        - target: mockup

  failed:
    description: "A pipeline stage failed"
    relevant_world: [node_id, status]
    on_enter:
      - set: { status: "failed" }
    view:
      extends: "base"
      blocks:
        body:
          - prose: "One of the host.demo.* verbs reported an error. See the room's on_error target for detail."
        choices:
          - list:
              items:
                - { label: "restart" }
    on:
      restart:
        - target: project
          effects:
            - set: { status: "", mockup_path: "", doctor_ok: false, doctor_report: "" }
