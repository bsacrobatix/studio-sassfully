test_kind: flow
app: ../app.yaml
use_orchestrator: true
# Registers the real graph builtin before the fixture replaces its catalog
# authority with the hermetic typestore mount.
host_bindings: { graph: host.graph }
typestore_graph_fixture:
  catalog: ../fixtures/typestore_catalog.yaml
  catalog_id: sassfully-catalog
  backend: sqlite
initial_state: check
initial_world:
  node_id: qa-feedback-privacy
  current_status: verified
  idempotency_key: qa-feedback-privacy-flow-1
  gate: "scripts/checks.sh"

# Only the shell gate is cassette-backed. The graph lifecycle below uses a
# real SQLite typestore mounted from the committed Sassfully catalog.
host_handlers:
  host.run:
    by_call:
      run_gate:
        data: { ok: false, stdout: "canonical validation: 1 issue\n", exit_code: 1 }
      write_evidence:
        data: { ok: true, stdout: "", exit_code: 0 }

turns:
  - intent: { name: look, slots: {} }
    expect_state: check
    expect_world:
      node_id: qa-feedback-privacy
      gate: "scripts/checks.sh"
      check_ok: false
      check_stdout: "canonical validation: 1 issue\n"

  - intent: { name: next, slots: {} }
    expect_state: attest
    expect_world:
      artifact_path: ".artifacts/qa-feedback-privacy/qa-check.log"
      status: "failed"
      mutation_applied: true
      mutation_replayed: false
      mutation_changed: true
    expect_view_matches: "guarded typestore lifecycle"

  # Receipt viewing never re-enters the mutation state, so it cannot rebuild a
  # later-revision request under a previously sealed idempotency key.
  - intent: { name: look, slots: {} }
    expect_state: receipt
    expect_world:
      mutation_applied: true
      mutation_replayed: false
      mutation_changed: true

  # Restart obtains a fresh catalog revision before rerunning the gate; only
  # attest-room receipt fields stay cleared.
  - intent: { name: restart, slots: {} }
    expect_state: check
    expect_world:
      check_ok: false
      check_stdout: "canonical validation: 1 issue\n"
      status: ""
      artifact_path: ""
      changeset_id: ""

expect_no_errors: true
