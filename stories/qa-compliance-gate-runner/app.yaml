# POG qa-compliance-gate-runner — deterministic qa-target materialization.
# It reads the catalog's current revision, then performs the canonical guarded
# typestore lifecycle: propose -> apply. The steward-bound qa-status proposal
# is authorized by the graph service as part of proposal. Every mutation carries
# the caller's durable run idempotency key, expected revision, and changeset
# digest; the final receipt is retained in Story world.
app:
  id: pog-qa-compliance-gate-runner
  version: 0.2.0
  title: "POG qa-target compliance gate runner"
  author: "pog"
  license: "CC0"

hosts:
  - host.run
  - host.graph.open
  - host.graph.propose
  - host.graph.apply

application:
  schema: application/v1
  name: Sassfully QA compliance runner
  description: Runs a qa-target gate and records its governed graph status.
  semantic_ref: pog-qa-compliance-gate-runner.application
  pages:
    home:
      name: QA compliance
      description: Deterministic qa-target gate attestation.
      semantic_ref: pog-qa-compliance-gate-runner.page.home
  models:
    taxonomy: sassfully_catalog
    version: "1"
    types:
      core-node: {}
      qa-target: {}
      changeset: {}
    capability:
      types:
        core-node: &graph_access { read: true, write: true }
        qa-target: *graph_access
        changeset: *graph_access
  seed_catalog:
    path: fixtures/typestore_catalog.yaml
    namespace: sassfully_catalog
    version: "1"

world:
  node_id: { type: string, default: "" }
  graph_catalog_revision: { type: string, default: "" }
  # The materializer reads the qa-target before it starts this Story and
  # supplies the status it observed. The graph service verifies this guard at
  # apply time, together with graph_catalog_revision.
  current_status: { type: string, default: "" }
  idempotency_key: { type: string, default: "" }
  repo_root: { type: string, default: "." }
  gate: { type: string, default: "" }
  check_ok: { type: bool, default: false }
  check_stdout: { type: string, default: "" }
  check_exit: { type: int, default: 0 }
  artifact_path: { type: string, default: "" }
  status: { type: string, default: "" }
  changeset_id: { type: string, default: "" }
  content_digest: { type: string, default: "" }
  mutation_applied: { type: bool, default: false }
  mutation_replayed: { type: bool, default: false }
  mutation_changed: { type: bool, default: false }

intents:
  next:
    description: "Advance to the next stage."
    examples: ["next", "continue"]
    priority: 80
  restart:
    description: "Restart from the check stage."
    examples: ["restart", "start over"]
    priority: 40
  look:
    description: "Re-render the current stage."
    examples: ["look", "?"]
    priority: 10

root: check
include:
  - rooms/*.yaml
