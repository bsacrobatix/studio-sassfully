story_dirs:
  - ./.kitsoki/stories

project_profile: .kitsoki/project-profile.yaml

root:
  import: dev-story

# sassfully-dev: the sanctioned launch profile for this repository's Story
# applications. Graph access is granted only through the application's bound
# canonical typestore, never from a local catalog path. Ambient Claude auth,
# no secrets — machine-specific overrides
# (synthetic endpoints, quotas) belong in .kitsoki.local.yaml, which
# deep-merges on top and wins by profile name.
default_profile: sassfully-dev
harness_profiles:
  sassfully-dev:
    backend: claude
    model: opus
    models: [opus, sonnet, haiku]
    effort: medium
    efforts: [low, medium, high, xhigh, max]

# Graph authority is deployment-owned. The QA Story supplies only operation
# data and optimistic-concurrency receipts; it cannot choose a catalog path.
application_graphs:
  pog-qa-compliance-gate-runner:
    catalog: catalog:sassfully-catalog
    max_nodes: 200
    max_bytes: 1048576
    write_policy: steward
