  - authored_by: pog-cross-repo-feedback-propose
    created_at: "2026-07-19T00:16:56Z"
    id: cs-82963aac9b2dd54b09f3386169cf9b3d
    operations:
      - after:
          edges:
            part_of:
              - product-sassfully
          fields:
            summary: |-
              Goal: Let an automated QA driver (or any testid-based test) deterministically click through the feedback widget's two-step flow (kind picker -> textarea -> review -> submit) instead of relying on text-matching or class selectors.
              Why blocked: portal/src/feedback/vendor/feedback-vue/src/FeedbackModal.vue (vendored from studio-sassfully, PROVENANCE.md forbids hand-editing under src/) renders the kind-picker buttons, textarea, evidence-capture buttons, and Review/Submit buttons with only generic classes (fb-kind, fb-textarea, fb-btn-primary) and no data-testid at all. A live QA driver run on 2026-07-19 opened the widget, saw only the first-step kind picker (which has no textarea by design), and wrongly reported the whole widget as read-only without clicking through — because there was no deterministic affordance pointing it at the next step. Worked around this on the POG side by registering the existing CSS classes as affordances in tools/product-journey/drivers/pog-portal.json (feedback-kind-picker, feedback-textarea, feedback-primary-action) and adding explicit prose warning the driver that step 1 has no text field by design, but a real data-testid on each kind button (testid keyed by kind.id: bug/issue_request/content_comment/question) would be the correct fix and is more robust than class selectors, which can collide with future styling-only class changes.
              Expected: FeedbackModal.vue's kind buttons, textarea, and primary action buttons carry stable data-testid attributes (e.g. data-testid="fb-kind-{{ kind.id ?? kind.kind ?? kind }}"), fixed upstream in studio-sassfully and pulled in via scripts/sync-feedback-core.sh — not hand-patched in the vendored copy per its own PROVENANCE.md.
              Filed cross-repo from POG's autonomous feedback pipeline (report 01KXVT8NVXZYQY69GN2AG1YY7E, kind bug). Steward rationale: The file's own PROVENANCE.md forbids hand-editing the vendored copy; the report itself states the correct fix is upstream in studio-sassfully pulled in via scripts/sync-feedback-core.sh, so ownership belongs to sassfully, not POG.
          id: req-cross-pog-01kxvt8nvxzyqy69gn2ag1yy7e
          schema: sassfully/requirement/v0
          sources:
            - source-pog-feedback-01KXVT8NVXZYQY69GN2AG1YY7E
          status: proposed
          title: Vendored FeedbackModal.vue has no data-testid on kind-picker buttons, textarea, or submit
          visibility: public
        kind: added
