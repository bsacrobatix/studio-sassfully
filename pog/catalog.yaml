schema: project-object-graph/seed-catalog/v0
catalog:
  id: sassfully-catalog
  title: sassfully — product object graph
  status: active
  visibility: public
  purpose: product-catalog
  # Catalog-first development: this graph exists before the first line of
  # code. Requirements and use cases are mined from docs/concept.md and
  # docs/requirements/slidey-generic-feedback-brief.md; the design/PRD pass
  # (a recorded dev-story session) will confirm or amend them as decision
  # nodes before implementation starts. Lint: scripts/checks.sh.
  source_window:
    branch: main
    sampled_at: "2026-07-05"
    inputs:
      - id: source-pog-graph-mcp-plan
        kind: external-document
        path: "../POG/.context/graph-mcp-plan.md"
      - id: source-concept
        kind: document
        path: docs/concept.md
      - id: source-slidey-brief
        kind: document
        path: docs/requirements/slidey-generic-feedback-brief.md
      - id: source-rich-evidence-sidecars
        kind: document
        path: docs/requirements/rich-evidence-sidecars.md
      - id: source-extension-mode
        kind: document
        path: docs/requirements/extension-mode.md
      - id: source-kitsoki-feedback-proposal
        kind: external-document
        path: "../Kitsoki/docs/proposals/generic-feedback-sdk-slidey-reports.md"
type_registry:
  - id: core-node
    schema: graph-type/v0
    extends: null
    summary: Shared envelope for every sassfully graph node.
    required_fields:
      - id
      - schema
      - title
      - status
      - visibility
      - sources
      - edges
  - id: product
    schema: graph-type/v0
    extends: core-node
    summary: The product root node.
  - id: requirement
    schema: graph-type/v0
    extends: core-node
    summary: Durable, testable statement the product must satisfy.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
        nests_under: true
      - id: motivated_by
        target_type: use-case
        cardinality: many
  - id: use-case
    schema: graph-type/v0
    extends: core-node
    summary: A host-and-user scenario that motivates requirements.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: acceptance
        target_type: requirement
        cardinality: many
    artifact:
      format: json
      presentation: media
      schema: sassfully/artifact/mockup-packet/v0
    materialize:
      context_edges:
        - acceptance
      gates:
        - journey
        - for_persona
      params:
        - id: audience
          type: enum
          values:
            - internal
            - public
      story: stories/mockup-packet
  - id: limitation
    schema: graph-type/v0
    extends: core-node
    summary: An explicit non-requirement — pinned so scope creep is lintable, per the brief's own non-goals.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: constrains
        target_type: requirement
        cardinality: many
  - id: milestone
    schema: graph-type/v0
    extends: core-node
    summary: A delivery step in the product sequence; each proves a claim.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: delivers
        target_type: requirement
        cardinality: many
      - id: after
        target_type: milestone
        cardinality: one
        acyclic: true
  - id: feature
    schema: graph-type/v0
    extends: core-node
    summary: A durable product capability grouping requirements and use cases under one deliverable-facing name; realness derives from its acceptance requirements' status and the deliverables that demonstrate/prove it, same convention as POG's own `pog/feature/v0`.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: requirements
        target_type: requirement
        cardinality: many
      - id: use_cases
        target_type: use-case
        cardinality: many
  - id: component
    schema: graph-type/v0
    extends: core-node
    summary: A planned package/module boundary from the brief; becomes real when implementation nodes land against it.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: satisfies
        target_type: requirement
        cardinality: many
  # Deliverable layer — POG materialization-first taxonomy (2026-07-11):
  # deliverable nodes are SPECS of real evidence/functionality artifacts
  # (demos, docs, tutorials, test evidence); "work" is the act of
  # materializing them, and a deliverable is REAL exactly when its latest
  # materialize run's Starlark gate check passes. Status uses the derived
  # EvidenceStatus vocabulary (missing | planned | in-progress | failed |
  # verified | stale) — flipped by runs, never hand-curated. The test-suite
  # type carries the full contract (producer story + type-provided
  # assertion); demo/doc/tutorial get their story bindings as the product
  # grows the artifacts they judge.
  - id: test-suite
    schema: graph-type/v0
    extends: core-node
    summary: Recorded deterministic test/flow evidence; real when the recorded runs are clean per the type-provided flows_recorded assertion.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: proves
        target_type: requirement
        cardinality: many
    artifact:
      schema: sassfully/artifact/flow-evidence/v0
      format: json
      presentation: document
    materialize:
      checks:
        - capabilities:
            fs:
              read:
                - pog/evidence/**
          id: gate
          inputs_field: check_inputs
          script: scripts/checks/flows_recorded.star
      context_edges:
        - proves
      params:
        - default: scripts/record-flow-evidence.sh
          id: record_command
          type: string
        - default: .
          id: repo_root
          type: string
      story: stories/record-flow-evidence
  - id: demo
    schema: graph-type/v0
    extends: core-node
    summary: A recorded demonstration packet (tours + rrweb clips + deck) of a use case; real when the committed packet satisfies the type-provided demo_packet assertion.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: demonstrates
        target_type: use-case
        cardinality: many
    artifact:
      schema: sassfully/artifact/demo-packet/v0
      format: json
      presentation: media
    materialize:
      checks:
        - capabilities:
            fs:
              read:
                - stories/**
                - .artifacts/**
          id: gate
          inputs_field: check_inputs
          script: scripts/checks/demo_packet.star
      context_edges:
        - demonstrates
      params:
        - default: ""
          id: target_url
          type: string
      story: stories/demo-packet
  - id: doc
    schema: graph-type/v0
    extends: core-node
    summary: A generated document projected from the node's graph context; real when the declared artifact paths exist per the type-provided artifact_exists assertion.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: documents
        target_type: requirement
        cardinality: many
    artifact:
      schema: sassfully/artifact/doc/v0
      format: markdown
      presentation: document
    materialize:
      checks:
        - capabilities:
            fs:
              read:
                - .artifacts/**
                - docs/**
          id: gate
          inputs_field: check_inputs
          script: scripts/checks/artifact_exists.star
      context_edges:
        - documents
      params:
        - default: 2
          id: depth
          type: int
        - id: audience
          type: enum
          values:
            - internal
            - public
      story: stories/materialize-doc
  - id: tutorial
    schema: graph-type/v0
    extends: core-node
    summary: A step-by-step walkthrough teaching a use case; real when the declared artifact paths exist per the type-provided artifact_exists assertion.
    edge_fields:
      - id: part_of
        target_type: product
        cardinality: one
      - id: teaches
        target_type: use-case
        cardinality: many
    artifact:
      schema: sassfully/artifact/doc/v0
      format: markdown
      presentation: document
    materialize:
      checks:
        - capabilities:
            fs:
              read:
                - .artifacts/**
                - docs/**
          id: gate
          inputs_field: check_inputs
          script: scripts/checks/artifact_exists.star
      context_edges:
        - teaches
      params:
        - default: 2
          id: depth
          type: int
        - id: audience
          type: enum
          values:
            - internal
            - public
      story: stories/materialize-doc
  # The structured write primitive (cribbed from the POG program catalog):
  # system-authored writes — materialize write-backs, derived status flips —
  # land as changeset nodes, so every catalog mutation has provenance.
  - id: changeset
    schema: graph-type/v0
    extends: core-node
    summary: A reviewable, structured edit to this catalog; content writes are changesets, lifecycle flips are direct writes with provenance.
  - artifact:
      format: json
      presentation: document
      schema: sassfully/artifact/qa-target-check/v0
    edge_fields:
      - cardinality: one
        id: part_of
        target_type: product
      - cardinality: many
        id: verifies
        target_type: requirement
    extends: core-node
    id: qa-target
    materialize:
      context_edges:
        - verifies
      gates:
        - gate
      params:
        - default: pog/catalog.yaml
          id: catalog_path
          type: string
        - default: .
          id: repo_root
          type: string
      story: stories/qa-compliance-gate-runner
    schema: graph-type/v0
    summary: Deterministically checkable proof that a requirement is satisfied; status is derived by a runner, never hand-edited.
nodes:
  # --- product -----------------------------------------------------------
  - schema: sassfully/product/v0
    id: product-sassfully
    title: sassfully
    status: active
    visibility: public
    summary: A generic, contextual-feedback framework — bring-your-own presentation, semantically-anchored feedback (bug reports, comments, copy/design feedback, questions, AI instructions), routed to the outcome each item deserves, with capture opt-in and privacy-controlled.
    sources: [source-concept]
    edges: {}
  # --- requirements (product) ---------------------------------------------
  - schema: sassfully/requirement/v0
    id: req-conflict-safe-landing
    title: Landing preserves dirty work and resolves integration conflicts in isolation
    status: in-progress
    visibility: public
    summary: A protected-main landing captures pre-existing tracked work on a recovery branch, integrates a feature in a disposable worktree, offers an injected resolver and lost-work review, and only promotes an audited integration result. It never uses shared stash state or silently discards either side.
    sources: [source-concept]
    edges:
      part_of: [product-sassfully]
  - schema: sassfully/requirement/v0
    id: req-generic-kinds
    title: Feedback is generic by kind
    status: draft
    visibility: public
    summary: "Support at least: bug, content_comment, copy_feedback, design_feedback, question, ai_instruction, issue_request, approval, rejection. Kind may change copy, required fields, review UI, and sink routing — it must not fork the anchor or evidence model."
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-product-site-feedback]
  - schema: sassfully/requirement/v0
    id: req-anchor-any-point
    title: Feedback is anchorable at any visible point
    status: draft
    visibility: public
    summary: "A feedback item can target: the whole artifact, the current scope, scope plus step, a visible element picked in annotation mode, an opened reference, or a media/replay time position when the host supports it."
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback]
  - schema: sassfully/requirement/v0
    id: req-producer-owned-anchors
    title: Anchors are producer-owned and portable
    status: draft
    visibility: public
    summary: A generic anchor envelope (producer, artifactId, scope, step, ref, label, bbox, mediaTimeMs, url, extra) where only the producer interprets scope/step/ref. Consumers may display fields, never parse their meaning.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-pm-portal-feedback]
  - schema: sassfully/requirement/v0
    id: req-capture-review-submit
    title: Capture, review, and sink submission are separate stages
    status: draft
    visibility: public
    summary: Collect a draft locally, show it for review, submit only the reviewed bundle — even for low-friction comments. Feedback is not mutation; the reviewed note is the artifact.
    sources: [source-slidey-brief, source-concept]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-bug-report-with-replay, uc-agent-files-tool-gap]
  - schema: sassfully/requirement/v0
    id: req-multi-sink-routing
    title: One feedback item can route to multiple sinks
    status: draft
    visibility: public
    summary: "Sink contract supports: local JSONL note, GitHub/Jira/Linear issue, issue/PR comment, review comment, AI instruction dispatch, reviewed artifact bundle, and no-op dry-run. The frontend never knows upload mechanics, labels, templates, auth, or storage layout."
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-product-site-feedback, uc-pm-portal-feedback]
  - schema: sassfully/requirement/v0
    id: req-ai-actionable-bundle
    title: Reviewed bundles preserve enough state for AI action
    status: draft
    visibility: public
    summary: An ai_instruction or issue-to-agent bundle includes the user instruction, anchor envelope, artifact identity, allowed source excerpt or stable pointer, reviewed label/snippet, relevant references, and a preferred action (comment-only, propose patch, patch artifact, file issue).
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-pm-portal-feedback]
  - schema: sassfully/requirement/v0
    id: req-feedback-artifact-deck
    title: A reviewed bundle can render as a report deck
    status: draft
    visibility: public
    summary: Summary scene, anchor scene, optional before/after or thumbnail, evidence/privacy review scene, sink receipt scene — an artifact, never the primary data model.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback]
  - schema: sassfully/requirement/v0
    id: req-standalone-and-embedded
    title: The UI works standalone and embedded
    status: draft
    visibility: public
    summary: "Modes: standalone shell trigger; embedded with the parent host owning the trigger via embed:view / embed:annotate / embed:pick; workspace edit mode without conflicting with inline editing; minimal accessible present mode; read-only bundles where mutation is never assumed."
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-product-site-feedback]
  # --- requirements (privacy) ----------------------------------------------
  - schema: sassfully/requirement/v0
    id: req-privacy-metadata-first-class
    title: Privacy metadata is first-class
    status: draft
    visibility: public
    summary: Every field in a reviewed bundle carries source, sensitivity, policy, review state, and retention metadata.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-data-avoidance-default
    title: Data avoidance is the default
    status: draft
    visibility: public
    summary: Prefer producer ids, indices, refs, roles, labels, bboxes, hashes, and short reviewed snippets over raw DOM text, full screenshots, HAR, console objects, or replay logs.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: []
  - schema: sassfully/requirement/v0
    id: req-raw-drafts-stay-local
    title: Raw draft data stays local by default
    status: draft
    visibility: public
    summary: Remote sinks and AI processors receive only the lean reviewed bundle by default. Raw evidence remains local unless a reviewer individually approves a bundle-first sidecar upload under req-reviewed-sidecar-lifecycle; user-entered text is shown in review and marked user-provided.
    sources: [source-slidey-brief, source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-agent-files-tool-gap]
  - schema: sassfully/requirement/v0
    id: req-host-policy-gates-evidence
    title: Host policies gate high-risk evidence
    status: draft
    visibility: public
    summary: Hosts gate high-risk evidence and may retain bounded local HAR/rrweb rings with capture-time redaction and input masking. Raw upload is unchecked by default and requires reviewer approval per item; no annotation screenshot is permitted. This supersedes the prior blanket HAR/rrweb-off wording.
    sources: [source-slidey-brief, source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay, uc-deck-feedback]
  # --- requirements (gaps found vs. kitsoki's current bug-reporting mechanism,
  #     see source-kitsoki-feedback-proposal) --------------------------------
  - schema: sassfully/requirement/v0
    id: req-sink-lifecycle-ops
    title: Sinks support erasure and evidence replacement
    status: draft
    visibility: public
    summary: A submitted item is not append-only. A sink implements erase(id, reason) for data-subject deletion requests and replaceEvidence(id, bundle) for correcting/upgrading a filed item's evidence, in addition to submit(). Frontend and core never assume a sink is create-only.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-product-site-feedback, uc-pm-portal-feedback]
  - schema: sassfully/requirement/v0
    id: req-idempotent-submission
    title: Submission is idempotent
    status: draft
    visibility: public
    summary: Every reviewed bundle carries a stable idempotency key; retrying a submit (network failure, duplicate click) must not create a second ticket/note at the sink.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-product-site-feedback, uc-pm-portal-feedback]
  - schema: sassfully/requirement/v0
    id: req-privacy-fail-closed
    title: Unclassified or high-risk fields block submission
    status: draft
    visibility: public
    summary: Submit is blocked, not silently allowed, when a plugin/provider contributes a field with unknown sensitivity or a high-risk field lacking a host-declared policy. The reporter or host must resolve it before the bundle can leave the browser.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-legal-basis-metadata
    title: Bundles record a legal basis for personal data
    status: draft
    visibility: public
    summary: When a bundle contains personal data, it records a legal basis (consent, legitimate interest, contract, legal obligation, or host-declared) distinct from the field-level handling policy. The core never invents this basis on the host's behalf.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-public-sink-abuse-controls
    title: Public, unauthenticated submission paths resist abuse
    status: draft
    visibility: public
    summary: A sink reachable by an anonymous visitor (e.g. a generated product site) enforces edge-level abuse controls — rate limits, proof-of-work, or captcha-equivalent checks — before accepting a submission, rather than relying on persistent reporter identity.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-product-site-feedback]
  - schema: sassfully/requirement/v0
    id: req-submission-context
    title: Reviewed bundles carry producer-supplied diagnostic context
    status: in-progress
    visibility: public
    summary: A producer may attach arbitrary diagnostic context to a draft, but every context field path must be classified by the host privacy manifest before submission.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-product-site-feedback]
  - schema: sassfully/requirement/v0
    id: req-http-sink
    title: Reviewed bundles can submit to an HTTP intake
    status: implemented
    visibility: public
    summary: A reusable HTTP sink POSTs reviewed bundles with idempotency preserved and surfaces transport failures for safe retry.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-deck-feedback, uc-product-site-feedback]
  - schema: sassfully/requirement/v0
    id: req-ai-triage-narrative
    title: Reviewed bundles carry an AI-authored triage narrative
    status: draft
    visibility: public
    summary: Beyond the user's own text, the reviewed bundle can carry a generated narrative — distilled problem statement, suspected category/component, reproduction hints, and confidence — produced from the bundle's own evidence. This is the artifact's differentiator over a plain evidence dump; it is dependency-injected and cassette/stubbed in tests so no automated run calls a live LLM.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-pm-portal-feedback, uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-reproducible-anchor-trace
    title: An anchor can carry a deterministic reproduction pointer
    status: draft
    visibility: public
    summary: When the producer has one, the anchor envelope's extra field can carry a stable pointer to a deterministic, replayable interaction trace (not just a narrative description), so a downstream automated fix pipeline can reproduce the reported state rather than only read about it.
    sources: [source-kitsoki-feedback-proposal]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-reviewed-sidecar-lifecycle
    title: Raw evidence uses approved, bundle-first sidecars
    status: accepted
    visibility: public
    summary: A reviewed bundle projects only lean evidence metadata (kind, label, digest, snippet, content type, size, transport, and approved state), never raw payload. Each raw sidecar starts unchecked; only approved items upload after a successful or deduped bundle receipt, keyed by idempotency key plus digest. Unsupported sinks return digest-only skipped results and failed items remain retryable.
    sources: [source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-capture-time-sidecar-privacy
    title: Sidecar capture is bounded and redacted before review
    status: accepted
    visibility: public
    summary: Always-on capture, where a host enables it, is bounded in local rings and snapshots on attach. Header/query/body redaction and input masking happen at capture time; server-trace markers exclude browser trace bodies; annotations carry no screenshot. Any unclassified reviewed metadata fails closed.
    sources: [source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-sidecar-intake-safety
    title: Hosted intake safely persists approved sidecars
    status: accepted
    visibility: public
    summary: The versioned sidecar envelope is bundle-first. Hosted/local intake enforces the existing rate policy and a 2 MiB sidecar cap, validates key and digest before path construction, writes only evidence/key/digest.ext, rebuilds bundle-key lookup across relevant monthly ledgers, and never persists client IPs.
    sources: [source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-bug-report-with-replay, uc-product-site-feedback]
  # --- use cases ------------------------------------------------------------
  - schema: sassfully/use-case/v0
    id: uc-deck-feedback
    title: Deck feedback in slidey
    status: draft
    visibility: public
    summary: A viewer gives feedback at any visible point of a slidey deck via the embed protocol (embed:view scope/step, embed:pick anchors); a scene/step anchor plus thumbnail is enough for copy/design comments. slidey is the first real host and the host-neutrality proof.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      acceptance: [req-anchor-any-point, req-producer-owned-anchors, req-standalone-and-embedded]
  - schema: sassfully/use-case/v0
    id: uc-product-site-feedback
    title: Product-site feedback
    status: draft
    visibility: public
    summary: A visitor files feedback on a generated product site; routing turns it into a comment, an issue, or a support request.
    sources: [source-concept]
    edges:
      part_of: [product-sassfully]
      acceptance: [req-generic-kinds, req-multi-sink-routing, req-sink-lifecycle-ops, req-idempotent-submission, req-public-sink-abuse-controls]
  - schema: sassfully/use-case/v0
    id: uc-pm-portal-feedback
    title: PM-portal feedback
    status: draft
    visibility: public
    summary: A reviewer annotates a catalog/portal surface; an ai_instruction outcome dispatches the reviewed bundle to an authoring/refine flow.
    sources: [source-concept]
    edges:
      part_of: [product-sassfully]
      acceptance:
        - req-ai-actionable-bundle
        - req-multi-sink-routing
        - req-sink-lifecycle-ops
        - req-idempotent-submission
        - req-ai-triage-narrative
        - req-env-sink-routing
        - req-fix-loop-outcome
    journey:
      - A PM reviewing a catalog/portal surface (a node, a changeset diff, a deliverable) spots something worth flagging.
      - Annotates in place via the same widget (host = the POG portal itself, dogfooding its own feedback channel — feature-pm-portal).
      - Review step applies the same privacy-fail-closed gate as any other host; the PM's annotation anchors to the portal surface it was made against.
      - On submit, an ai_instruction outcome dispatches the reviewed bundle toward an authoring/refine flow rather than a plain local note — the portal's own feedback becomes graph-actionable, not just a log line.
    outcome: Feedback about the tracking tool itself flows through the tool being tracked, landing as a bundle an authoring flow can act on — closing the loop described in plan.md §6 point 4.
    stakes: v0.1's sink is local JSONL (decision FD4); the catalog-sink (feedback -> proposed ask/req node) lands once graph-MCP P6's feedback-routing patterns are reusable here, already true as of graph-mcp P6 landing on kitsoki main.
  - schema: sassfully/use-case/v0
    id: uc-bug-report-with-replay
    title: Bug report with replay evidence
    status: draft
    visibility: public
    summary: The kitsoki-lineage case — a bug report carrying opt-in rrweb replay and network summary, with privacy review before submission.
    sources: [source-slidey-brief]
    edges:
      part_of: [product-sassfully]
      acceptance: [req-host-policy-gates-evidence, req-privacy-metadata-first-class, req-capture-review-submit, req-privacy-fail-closed, req-legal-basis-metadata, req-ai-triage-narrative, req-reproducible-anchor-trace, req-reviewed-sidecar-lifecycle, req-capture-time-sidecar-privacy, req-sidecar-intake-safety]
    journey:
      - User hits an issue in a host app embedding the widget; triggers the reporter (floating, chromeless trigger).
      - Widget captures an anchor at the trigger point (producer-owned, per req-producer-owned-anchors) plus an optional rrweb replay clip and network summary, opt-in per host policy.
      - "Review step surfaces the privacy manifest before submission — fields the manifest has not classified block submit (req-privacy-fail-closed). Raw capture stays local by default; only an individually approved sidecar may leave the device after a successful or deduped bundle receipt (req-reviewed-sidecar-lifecycle)."
      - User adds prose + picks a kind (bug is one of several, not privileged — lim-not-bug-specific) and submits; a client-side idempotency key dedupes accidental double-submits (req-idempotent-submission).
      - Bundle routes to a configured sink (local/bundle/dry-run in v0.1; GitHub is a later parity follow-on, never required — lim-not-github-specific).
    outcome: A reviewed, privacy-scrubbed feedback bundle lands in the configured sink with a reproducible anchor trace, ready for triage without a bespoke reporter per host app.
    stakes: v0.1 (feature-feedback-core, Stage 2.3) proves capture->review->submit + privacy fail-closed + anchors end to end; the rrweb replay plugin itself, GitHub sink, and spatial anchors are kitsoki-parity follow-ons layered on afterward (see plan.md scope ledger), not blocking this use case's v0.1 acceptance.
    for_persona: An end user of a host app that embeds the feedback widget — hits a bug mid-task and files a report with replay evidence without leaving the page.
    materialization:
      artifacts: []
      job_id: 01KXA84RWB2N7TPC6CZ9G8FYAK
      stages:
        - id: project
          status: complete
        - id: mockup
          status: complete
        - id: tours
          status: complete
        - id: capture
          status: complete
        - id: doctor
          status: complete
      status: complete
      story: stories/mockup-packet
