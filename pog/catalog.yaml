  - schema: sassfully/use-case/v0
    id: uc-ext-bug-report
    title: Zero-integration bug report via the browser extension
    status: draft
    visibility: public
    summary: A user on an arbitrary site enables the sassfully extension, reproduces a bug with the rolling buffer on, and files a bug carrying a trailing replay clip and telemetry through capture -> review -> submit, with nothing integrated by the site.
    sources: [source-extension-mode]
    edges:
      part_of: [product-sassfully]
      acceptance: [req-zero-integration-capture, req-recording-visibility, req-ext-bridge-enrich, req-local-first-sink, req-sidecar-chunking, req-capture-review-submit, req-privacy-fail-closed, req-producer-owned-anchors, req-host-policy-gates-evidence]
    journey:
      - User enables sassfully-ext for the site's origin; the badge shows the rolling buffer is on.
      - A bug happens; the user opens the capture overlay (or the extension popup), picks the bug kind, optionally picks the element (bbox), and writes what went wrong.
      - The ring freezes a trailing-window replay snapshot plus network/console/error telemetry as draft evidence.
      - A dedicated review page shows the lean reviewed payload and per-item upload approvals; the extension's own privacy manifest gates submission fail-closed.
      - The reviewed bundle lands in the local store; the user exports it, or pushes it to a configured intake, chunked replay sidecars following the bundle receipt.
    outcome: A reviewed, privacy-gated bug report with replay evidence from a site that never integrated sassfully.
    for_persona: Anyone reporting a bug on a site they use but do not control — QA engineers, support staff, dogfooding teams.
