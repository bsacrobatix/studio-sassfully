  # --- extension mode (zero-integration capture; see source-extension-mode) ---
  - schema: sassfully/requirement/v0
    id: req-zero-integration-capture
    title: Extension captures only on explicitly user-enabled origins
    status: draft
    visibility: public
    summary: The browser extension observes a page only after the user enables that origin. Enablement is per-origin, stored locally, never synced or transmitted by default. Non-enabled origins get no injection and no recording; disabling stops capture immediately and clears the ring.
    sources: [source-extension-mode]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-ext-bug-report]
  - schema: sassfully/requirement/v0
    id: req-recording-visibility
    title: Recording state is always visibly truthful
    status: draft
    visibility: public
    summary: "The browser-action badge reflects the focused tab's capture state at all times: distinct states for rolling buffer, on-demand recording, bridged-to-host-SDK, and off. The popup states the same fact in words. No configuration allows capture without the badge saying so."
    sources: [source-extension-mode]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-ext-bug-report]
  - schema: sassfully/requirement/v0
    id: req-ext-bridge-enrich
    title: Extension enriches a detected host SDK instead of competing with it
    status: draft
    visibility: public
    summary: A versioned same-origin postMessage handshake (sassfully-ext/bridge/v1) lets the extension offer its evidence providers to a page's integrated SDK. On acceptance the host's anchors, manifest, review, and sinks own the flow, and the extension's standalone UI never activates on that page. Hosts opt in via a small feedback-core helper; hosts that do nothing see no change.
    sources: [source-extension-mode]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-ext-bug-report]
  - schema: sassfully/requirement/v0
    id: req-local-first-sink
    title: Extension feedback is local-first with opt-in remote intake
    status: draft
    visibility: public
    summary: Reviewed bundles and approved sidecars persist to extension-local storage and export to files. Remote submission requires the user to configure an intake URL and explicitly push stored bundles through the existing httpSink/intake contract. Nothing leaves the device otherwise.
    sources: [source-extension-mode]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-ext-bug-report]
  - schema: sassfully/requirement/v0
    id: req-sidecar-chunking
    title: Oversized sidecars chunk into individually approved items
    status: draft
    visibility: public
    summary: A replay clip larger than the sidecar transport cap splits into ordered replay-chunk i/N items sharing a clipId, each with its own digest, each individually reviewable and approvable, each under the cap. Chunking is transport-only; per-item review semantics are unchanged.
    sources: [source-extension-mode, source-rich-evidence-sidecars]
    edges:
      part_of: [product-sassfully]
      motivated_by: [uc-ext-bug-report, uc-bug-report-with-replay]
  - schema: sassfully/requirement/v0
    id: req-ext-narrated-demo-poc
    title: Extension plays an LLM-driven narrated browser demo from a bounded demo script (POC)
    status: draft
    visibility: public
