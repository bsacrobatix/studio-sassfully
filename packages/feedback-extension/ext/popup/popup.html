<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sassfully</title>
  <style>
    body { font: 13px/1.5 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .state { padding: 6px 8px; border-radius: 6px; margin: 8px 0; font-weight: 600; }
    .state.on { background: #e8f5e9; color: #2e7d32; }
    .state.rec { background: #ffebee; color: #c62828; }
    .state.sdk { background: #e3f2fd; color: #1565c0; }
    .state.off { background: #f5f5f5; color: #666; }
    button { width: 100%; margin: 4px 0; padding: 7px; cursor: pointer; }
    label { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
    input { min-width: 0; flex: 1; }
    .muted { color: #666; font-size: 12px; }
    a { color: #1565c0; }
  </style>
</head>
<body>
  <h1>Sassfully feedback</h1>
  <div id="app">Loading…</div>
  <p class="muted"><a href="#" id="options">Intake &amp; settings</a></p>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
